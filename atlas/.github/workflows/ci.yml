name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mobile:
    name: Mobile e pacotes compartilhados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # Gate que sustenta o ADR-0014: mock e HTTP precisam expor a mesma
      # superfície. Um port sem par em algum adapter quebra o build aqui.
      - name: Verificar paridade de adapters
        run: node scripts/check-adapter-parity.mjs

      # Gate que sustenta a spec 30: os ports precisam bater com o OpenAPI.
      - name: Verificar paridade de contrato
        run: node scripts/check-contract-parity.mjs

  api:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - run: dotnet restore apps/api/Atlas.sln
      - run: dotnet build apps/api/Atlas.sln --no-restore -c Release

      # Fronteira de módulo é mantida por teste, não por disciplina.
      - run: dotnet test apps/api/tests/Atlas.Architecture.Tests --no-build -c Release
      - run: dotnet test apps/api/Atlas.sln --no-build -c Release
