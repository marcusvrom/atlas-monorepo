openapi: 3.1.0
info:
  title: Atlas API
  version: 1.0.0
  description: |
    Contrato HTTP da plataforma Atlas.

    Este arquivo é a FONTE DE VERDADE do transporte. Ele deve permanecer em
    paridade com os ports em `packages/api-client/src/ports/` — o CI compara os
    paths declarados aqui com os métodos dos ports. Divergência é erro de build.

    Regra de evolução (spec 30 §6): adicionar campo opcional ou endpoint é
    permitido; remover, renomear ou estreitar tipo exige /api/v2 e 90 dias de
    convivência. Apps móveis não atualizam sincronizadamente.
servers:
  - url: https://api.atlas.app
    description: Produção
  - url: http://localhost:5080
    description: Desenvolvimento
security:
  - bearerAuth: []
tags:
  - name: Catalog
  - name: Programming
  - name: Session
  - name: Measurement
  - name: Insights
  - name: Marketplace
  - name: Identity
paths:
  /api/v1/me:
    get:
      tags:
        - Identity
      operationId: getMe
      summary: Perfil do usuário autenticado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      tags:
        - Identity
      operationId: updateProfile
      summary: Atualizar dados básicos do perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /api/v1/me/entitlements:
    get:
      tags:
        - Identity
      operationId: listEntitlements
      summary: Direitos de acesso do usuário
      description: |
        Fonte da verdade do paywall no client. Nenhuma tela infere plano —
        ela consulta direito de acesso. Ver spec 00 §4.8.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entitlement"
  /api/v1/exercises:
    get:
      tags:
        - Catalog
      operationId: listExercises
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: muscle
          in: query
          schema:
            type: string
        - name: equipment
          in: query
          schema:
            $ref: "#/components/schemas/Equipment"
        - name: difficulty
          in: query
          schema:
            $ref: "#/components/schemas/Difficulty"
        - name: protectedRegion
          in: query
          description: >-
            Regiões que o usuário pediu para poupar. Repetir o parâmetro para
            várias. Exercícios cuja carga articular bate com alguma delas ficam
            fora da página. Ver assessExercise em @atlas/domain.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/BodyRegion"
          style: form
          explode: true
        - name: availableEquipment
          in: query
          description: >-
            Equipamento disponível. Ausente = sem restrição. Peso do corpo nunca
            é barrado por indisponibilidade.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Equipment"
          style: form
          explode: true
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExerciseSummary"
                  nextCursor:
                    type:
                      - string
                      - "null"
  /api/v1/exercises/{id}:
    get:
      tags:
        - Catalog
      operationId: getExercise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/muscle-groups:
    get:
      tags:
        - Catalog
      operationId: listMuscleGroups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MuscleGroup"
  /api/v1/workout-plans:
    get:
      tags:
        - Programming
      operationId: listPlans
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - published
              - archived
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkoutPlanSummary"
                  nextCursor:
                    type:
                      - string
                      - "null"
    post:
      tags:
        - Programming
      operationId: createPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - goal
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 80
                goal:
                  $ref: "#/components/schemas/GoalType"
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutPlan"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
  /api/v1/workout-plans/today:
    get:
      tags:
        - Programming
      operationId: getTodayWorkout
      summary: Treino do dia
      description: |
        Agregação orientada a CASO DE USO, não a recurso. A tela "Hoje" pede
        isto, não três endpoints. Ver ADR-0014.
      responses:
        "200":
          description: OK (null quando não há ficha ativa)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TodayWorkout"
                  - type: "null"
  /api/v1/sessions:
    post:
      tags:
        - Session
      operationId: startSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clientGeneratedId
                - planId
                - dayId
              properties:
                clientGeneratedId:
                  type: string
                  format: uuid
                planId:
                  type:
                    - string
                    - "null"
                  format: uuid
                dayId:
                  type:
                    - string
                    - "null"
                  format: uuid
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
  /api/v1/sessions/{id}/sets:batch:
    post:
      tags:
        - Session
      operationId: logSets
      summary: Sincronização em lote de séries executadas
      description: |
        Idempotente por `clientGeneratedId`. Devolve **207** com resultado
        PARTICIONADO: um item inválido nunca invalida o lote inteiro, o que
        evita travar a fila de sync do device para sempre. Ver spec 00 §9.2.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sets
              properties:
                sets:
                  type: array
                  items:
                    $ref: "#/components/schemas/PerformedSet"
      responses:
        "207":
          description: Resultado particionado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogSetsResult"
  /api/v1/insights/muscle-volume:
    get:
      tags:
        - Insights
      operationId: getMuscleVolume
      parameters:
        - name: periodDays
          in: query
          schema:
            type: integer
            enum:
              - 7
              - 30
              - 90
            default: 7
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MuscleVolume"
  /api/v1/professionals/search:
    get:
      tags:
        - Marketplace
      operationId: searchProfessionals
      parameters:
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radiusKm
          in: query
          schema:
            type: number
            default: 15
        - name: specialty
          in: query
          schema:
            type: string
        - name: modality
          in: query
          schema:
            type: string
            enum:
              - online
              - inPerson
              - hybrid
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProfessionalSummary"
                  nextCursor:
                    type:
                      - string
                      - "null"
  /api/v1/coach/clients:
    get:
      tags:
        - Marketplace
      operationId: listClients
      summary: Painel do profissional
      description: Read model denormalizado. Uma query, N alunos. Ver spec 00 §11.5.
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - risk
              - name
              - lastSession
            default: risk
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientOverview"
  /api/v1/workout-plans/{id}:
    get:
      tags:
        - Programming
      operationId: getPlan
      parameters:
        - &a1
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200": &a2
          description: Ficha de treino
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutPlan"
    put:
      tags:
        - Programming
      operationId: updatePlan
      parameters:
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanInput"
      responses:
        "200": *a2
        "409":
          description: Ficha publicada exige revisão
  /api/v1/workout-plans/{id}/publish:
    post:
      tags:
        - Programming
      operationId: publishPlan
      parameters:
        - *a1
      responses:
        "200": *a2
        "422":
          description: Ficha sem dias ou com dia vazio
  /api/v1/workout-plans/{id}/activate:
    post:
      tags:
        - Programming
      operationId: activatePlan
      parameters:
        - *a1
      responses:
        "204":
          description: Ficha ativada
  /api/v1/workout-plans/{id}/revisions:
    post:
      tags:
        - Programming
      operationId: revisePlan
      parameters:
        - *a1
      responses:
        "201": *a2
        "409":
          description: Origem deve estar publicada
  /api/v1/professionals/{id}:
    get:
      tags:
        - Marketplace
      operationId: getProfessionalDetail
      parameters:
        - *a1
      responses:
        "200":
          description: Detalhe validado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalDetail"
  /api/v1/coach/clients/{id}:
    get:
      tags:
        - Marketplace
      operationId: getClientDetail
      parameters:
        - *a1
      responses:
        "200":
          description: Detalhe validado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
  /api/v1/nutrition/daily-targets:
    get:
      tags:
        - Nutrition
      operationId: getDailyTargets
      description: Estimativa metabólica do dia (TMB, manutenção, alvo, macros e água),
        calculada pela fórmula versionada de @atlas/domain. NÃO é prescrição
        dietética; missingInputs lista o que falta no perfil para a estimativa
        ficar completa.
      responses:
        "200":
          description: Metas do dia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyTargets"
  /api/v1/nutrition/hydration/{date}:
    get:
      tags:
        - Nutrition
      operationId: getHydrationDay
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Meta, consumo e cronograma de água do dia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HydrationDay"
  /api/v1/nutrition/hydration/{date}/logs:
    post:
      tags:
        - Nutrition
      operationId: logWater
      description: Registra um copo. Reenvio do mesmo clientGeneratedId é no-op.
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogWaterInput"
      responses:
        "200":
          description: Dia de hidratação após o registro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HydrationDay"
  /api/v1/check-ins:
    get:
      tags:
        - Wellbeing
      operationId: listCheckIns
      parameters:
        - name: fromDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Autorrelatos no intervalo inclusivo, do mais recente ao mais antigo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInList"
  /api/v1/check-ins/{date}:
    put:
      tags:
        - Wellbeing
      operationId: upsertCheckIn
      description: Uma entrada por data. Reenvio do mesmo clientGeneratedId é no-op.
        Rascunhos admitem campos nulos; conclusão exige sono e energia.
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInInput"
      responses:
        "200":
          description: Check-in salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInEntry"
        "422":
          description: Escalas inválidas ou conclusão incompleta
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
  responses:
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    QuotaExceeded:
      description: |
        Limite do plano atingido. O corpo carrega o necessário para o client
        renderizar o paywall CONTEXTUAL sem hardcodar regra de plano.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  feature:
                    type: string
                  limit:
                    type: integer
                  currentPlan:
                    type: string
                  suggestedUpgrade:
                    type: string
  schemas:
    Problem:
      type: object
      description: RFC 9457
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    GoalType:
      type: string
      enum:
        - hypertrophy
        - fatLoss
        - strength
        - endurance
        - rehabilitation
        - generalHealth
    Equipment:
      type: string
      enum:
        - barbell
        - dumbbell
        - machine
        - cable
        - bodyweight
        - kettlebell
        - band
        - ball
        - none
    Difficulty:
      type: string
      enum:
        - beginner
        - intermediate
        - advanced
    BodyRegion:
      description: >-
        Região musculoesquelética que o usuário pode pedir para poupar. A lista
        é deliberadamente articular: o Atlas não pergunta diagnóstico, e
        condições que exigem liberação clínica não entram aqui.
      type: string
      enum:
        - shoulder
        - elbow
        - wrist
        - neck
        - lowerBack
        - hip
        - knee
        - ankle
    TrainingPreferences:
      type: object
      required:
        - experienceLevel
        - protectedRegions
        - availableEquipment
      properties:
        experienceLevel:
          description: >-
            Mesma escala de Difficulty, para que "exercício no meu nível" seja
            comparação direta.
          $ref: "#/components/schemas/Difficulty"
        protectedRegions:
          type: array
          items:
            $ref: "#/components/schemas/BodyRegion"
        availableEquipment:
          description: null = sem restrição, diferente de [] = nada disponível.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/Equipment"
    MuscleRole:
      type: string
      enum:
        - primary
        - secondary
        - stabilizer
    MuscleGroup:
      type: object
      required:
        - id
        - code
        - displayName
        - svgPathId
        - view
        - parentId
      properties:
        id:
          type: integer
        code:
          type: string
        displayName:
          type: string
        svgPathId:
          type: string
          description: Liga o dado ao <path> do SVG anatômico. Ver spec 11 §3.
        view:
          type: string
          enum:
            - anterior
            - posterior
            - both
        parentId:
          type:
            - integer
            - "null"
    MuscleActivation:
      type: object
      required:
        - muscleGroupId
        - muscleCode
        - role
        - activationWeight
      properties:
        muscleGroupId:
          type: integer
        muscleCode:
          type: string
        role:
          $ref: "#/components/schemas/MuscleRole"
        activationWeight:
          type: number
          minimum: 0
          maximum: 1
          description: Multiplicador do volume ponderado que alimenta o heatmap.
    ExerciseSummary:
      type: object
      required:
        - id
        - name
        - primaryMuscleCode
        - equipment
        - difficulty
        - thumbnailUrl
        - isCustom
        - stressedRegions
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        primaryMuscleCode:
          type: string
        equipment:
          $ref: "#/components/schemas/Equipment"
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        thumbnailUrl:
          type:
            - string
            - "null"
        isCustom:
          type: boolean
        stressedRegions:
          description: >-
            Regiões que o movimento carrega o bastante para importar a quem
            precisa poupá-las. Critério discriminante, não exaustivo: só o que
            um profissional trocaria primeiro. Não é contraindicação médica.
          type: array
          items:
            $ref: "#/components/schemas/BodyRegion"
    ExerciseDetail:
      allOf:
        - $ref: "#/components/schemas/ExerciseSummary"
        - type: object
          required:
            - description
            - media
            - activations
            - executionCues
            - commonMistakes
          properties:
            description:
              type: string
            media:
              type: array
              items:
                type: object
                required:
                  - kind
                  - url
                properties:
                  kind:
                    type: string
                    enum:
                      - loop
                      - video
                      - image
                  url:
                    type: string
                    format: uri
                  angle:
                    type: string
                    enum:
                      - front
                      - side
                      - rear
                  durationMs:
                    type: integer
            activations:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/MuscleActivation"
            executionCues:
              type: array
              items:
                type: string
            commonMistakes:
              type: array
              items:
                type: string
    SetPrescription:
      type: object
      properties:
        order:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        targetReps:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 9007199254740991
            - type: "null"
        targetRepsMax:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 9007199254740991
            - type: "null"
        targetDurationSeconds:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 9007199254740991
            - type: "null"
        targetWeightKg:
          anyOf:
            - type: number
              minimum: 0
            - type: "null"
        targetRir:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 10
            - type: "null"
        targetRpe:
          anyOf:
            - type: number
              minimum: 1
              maximum: 10
            - type: "null"
        restSeconds:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        isWarmup:
          default: false
          type: boolean
      required:
        - order
        - targetReps
        - targetRepsMax
        - targetDurationSeconds
        - targetWeightKg
        - targetRir
        - targetRpe
        - restSeconds
    ExercisePrescription:
      type: object
      properties:
        order:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        exerciseId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        exerciseName:
          type: string
          minLength: 1
        thumbnailUrl:
          anyOf:
            - type: string
              format: uri
            - type: "null"
        technique:
          default: straight
          type: string
          enum:
            - straight
            - superset
            - dropset
            - restPause
            - cluster
            - amrap
            - emom
            - isometric
        supersetGroup:
          type:
            - string
            - "null"
        notes:
          type:
            - string
            - "null"
        sets:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              order:
                type: integer
                minimum: 1
                maximum: 9007199254740991
              targetReps:
                anyOf:
                  - type: integer
                    minimum: 1
                    maximum: 9007199254740991
                  - type: "null"
              targetRepsMax:
                anyOf:
                  - type: integer
                    minimum: 1
                    maximum: 9007199254740991
                  - type: "null"
              targetDurationSeconds:
                anyOf:
                  - type: integer
                    minimum: 1
                    maximum: 9007199254740991
                  - type: "null"
              targetWeightKg:
                anyOf:
                  - type: number
                    minimum: 0
                  - type: "null"
              targetRir:
                anyOf:
                  - type: integer
                    minimum: 0
